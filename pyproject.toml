[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-fortigate-importer"
version = "0.2.0"
description = "Import FortiGate configurations into NetBox, with delta sync, review, dry run and rollback."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Matti" }]
# No runtime dependencies beyond NetBox: Django comes with NetBox, and
# "cryptography" (for encrypted backups) is already installed with NetBox's
# single sign-on libraries. NetBox versions are enforced at runtime by
# min_version in netbox_fortigate_importer/__init__.py.
dependencies = []

[tool.setuptools.packages.find]
include = ["netbox_fortigate_importer*"]

[tool.setuptools.package-data]
netbox_fortigate_importer = [
    "templates/netbox_fortigate_importer/*.html",
    "templates/netbox_fortigate_importer/**/*.html",
    "static/netbox_fortigate_importer/*",
    "tests/fixtures/*.conf",
    "tests/fixtures/third_party/*",
    "tests/fixtures/third_party/batfish/*",
]
