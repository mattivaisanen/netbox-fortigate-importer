#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
#conf_file_ver=99871234567890
#buildno=1639
#global_vdom=1
# Synthetic configuration written for the netbox-fortigate-importer tests.
# A FortiGate-60F at Branch 1, with an IPsec tunnel and iBGP to HQ-FW01.
config system global
    set alias "FGT60FTK21005678"
    set hostname "BRANCH1-FW01"
    set timezone 28
end
config system interface
    edit "dmz"
        set vdom "root"
        set status down
        set type physical
        set role dmz
    next
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.20 255.255.255.248
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "wan2"
        set vdom "root"
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.110.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type hard-switch
        set role lan
    next
    edit "internal-vl50"
        set vdom "root"
        set ip 10.110.50.1 255.255.255.0
        set allowaccess ping
        set role lan
        set interface "internal"
        set vlanid 50
    next
    edit "to-hq"
        set vdom "root"
        set ip 169.254.10.2 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 169.254.10.1 255.255.255.252
        set interface "wan1"
    next
end
config system virtual-switch
    edit "internal"
        set physical-switch "sw0"
        config port
            edit "internal1"
            next
            edit "internal2"
            next
            edit "internal3"
            next
            edit "internal4"
            next
            edit "internal5"
            next
        end
    next
end
config system dns
    set primary 10.20.0.53
end
config system dhcp server
    edit 1
        set default-gateway 10.110.1.1
        set netmask 255.255.255.0
        set interface "internal"
        config ip-range
            edit 1
                set start-ip 10.110.1.100
                set end-ip 10.110.1.200
            next
        end
        set dns-server1 10.20.0.53
    next
end
config firewall address
    edit "all"
    next
    edit "NET-BRANCH1"
        set subnet 10.110.0.0 255.255.0.0
    next
    edit "NET-HQ"
        set subnet 10.0.0.0 255.0.0.0
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 1
        set name "lan-out"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "to-hq"
        set srcintf "internal" "internal-vl50"
        set dstintf "to-hq"
        set action accept
        set srcaddr "NET-BRANCH1"
        set dstaddr "NET-HQ"
        set schedule "always"
        set service "ALL"
    next
end
config router static
    edit 1
        set gateway 198.51.100.17
        set device "wan1"
    next
    edit 2
        set dst 10.0.0.0 255.0.0.0
        set device "to-hq"
    next
end
config router bgp
    set as 65010
    set router-id 10.110.1.1
    config neighbor
        edit "169.254.10.1"
            set remote-as 65010
            set update-source "to-hq"
        next
    end
    config network
        edit 1
            set prefix 10.110.0.0 255.255.0.0
        next
    end
end
config vpn ipsec phase1-interface
    edit "to-hq"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256 aes256gcm-prfsha384
        set dhgrp 20 21
        set remote-gw 203.0.113.10
        set psksecret ENC R1ZmZGs0b3BsbWl1eXRyZXdxYXNkZmdoamts
    next
end
config vpn ipsec phase2-interface
    edit "to-hq-p2"
        set phase1name "to-hq"
        set proposal aes256-sha256 aes256gcm
        set dhgrp 20
        set keylifeseconds 3600
        set auto-negotiate enable
        set src-subnet 10.110.0.0 255.255.0.0
        set dst-subnet 10.0.0.0 255.0.0.0
    next
end
